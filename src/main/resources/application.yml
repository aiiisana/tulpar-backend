spring:
  application:
    name: tulpar

  # ─── DataSource ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ─── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  # ─── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── Redis ──────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL:false}

  # ─── Cache ──────────────────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 600000

  # ─── Multipart (file uploads) ───────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

# ─── Server ─────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ─── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Firebase ───────────────────────────────────────────────────────────────
firebase:
  service-account-path: firebase-service-account.json
  project-id:

# ─── Cloudflare R2 / S3-compatible storage ──────────────────────────────────
# R2 endpoint format: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
# Bucket must be created in the Cloudflare Dashboard before starting the app.
#
# public-url (optional): set to R2 public domain or custom domain to serve files
# via stable public URLs instead of presigned URLs.
# Leave empty (or unset) to use presigned URLs (private bucket).
#   Examples: https://pub-xxxx.r2.dev   or   https://media.yourdomain.com
minio:
  endpoint: ${R2_ENDPOINT:https://c5ba9bd76f3a4f23ced42727fd962f34.r2.cloudflarestorage.com}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket-name: ${R2_BUCKET:tulpar}
  public-url: ${R2_PUBLIC_URL:https://pub-cfcd1f8d9d334d638e5c522acf05a60b.r2.dev}
  presigned-url-expiry: 3600

# ─── AI / Perplexity ─────────────────────────────────────────────────────────
ai:
  openai:
    api-key: ${PERPLEXITY_API_KEY:}
    base-url: https://api.perplexity.ai
    model: sonar

# ─── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    kz.diploma.tulpar: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE















